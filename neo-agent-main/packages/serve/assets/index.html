<!-- @dsCard group="Console" viewport="1280x800" name="Web Console" subtitle="One screen — the session stream and the approval gate" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neo-agent console</title>
<link rel="stylesheet" href="/tokens.css">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.shell{
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  height:100%;
  background:var(--bg);
}

/* ---- top bar ---- */
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);
  padding:var(--sp-3) var(--sp-5);
  background:var(--surface);
  border-bottom:var(--border-w) solid var(--border);
}
.mark{
  font-family:var(--font-system);
  font-size:var(--text-md);
  font-weight:var(--weight-semibold);
  letter-spacing:var(--tracking-tight);
  color:var(--text);
}
.mark em{font-style:normal;color:var(--accent)}
.bar-right{display:flex;align-items:center;gap:var(--sp-3)}
.bar-label{
  font-family:var(--font-system);
  font-size:var(--text-xs);
  letter-spacing:var(--tracking-label);
  text-transform:uppercase;
  color:var(--text-faint);
}
#connection-status{
  font-family:var(--font-system);
  font-size:var(--text-sm);
  color:var(--text-muted);
  min-width:12ch;
  min-height:1.4em;
  display:inline-block;
}

/* ---- body: stream | gate ---- */
.body{
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  min-height:0;
}
@media (max-width:900px){
  .body{grid-template-columns:minmax(0,1fr)}
  .rail{border-left:0;border-top:var(--border-w) solid var(--border)}
}

.stream{
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  min-height:0;
  min-width:0;
}

/* ---- truncation strip ---- */
.strip{
  display:flex;align-items:center;gap:var(--sp-3);
  padding:var(--sp-2) var(--sp-5);
  border-bottom:var(--border-w) solid var(--border-subtle);
  background:var(--surface-inset);
  min-height:var(--control-h-sm);
}
#transcript-truncation{
  flex:1 1 auto;
  font-family:var(--font-system);
  font-size:var(--text-xs);
  letter-spacing:var(--tracking-label);
  color:var(--text-faint);
  min-height:1.2em;
}

/* ---- transcript ---- */
#transcript{
  overflow-y:auto;
  padding:var(--sp-5);
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:var(--sp-3);
}

/* provenance — glyph + border style + label carry the state; color is never alone */
.prov{
  max-width:var(--measure);
  padding:var(--sp-3) var(--sp-4);
  border-radius:var(--radius-md);
  background:var(--surface);
  border:var(--border-w) solid var(--border);
  border-left-width:var(--sp-1);
  font-family:var(--font-system);
  font-size:var(--text-sm);
  line-height:var(--leading-normal);
}
.prov::before{
  display:inline-block;
  margin-right:var(--sp-2);
  font-weight:var(--weight-semibold);
}
.prov-requested{border-left-style:solid;border-left-color:var(--prov-user);color:var(--text)}
.prov-requested::before{content:"› ";color:var(--prov-user)}
.prov-proposed{border-style:dashed;border-left-color:var(--prov-proposed);color:var(--text)}
.prov-proposed::before{content:"◇ ";color:var(--prov-proposed)}
.prov-executed{border-left-style:solid;border-left-color:var(--prov-executed);background:var(--accent-surface)}
.prov-executed::before{content:"✓ ";color:var(--prov-executed)}
.prov-blocked{border-style:dotted;border-left-style:double;border-left-color:var(--prov-blocked);background:var(--warn-surface)}
.prov-blocked::before{content:"⊘ ";color:var(--prov-blocked)}
.prov-label{
  display:block;
  font-size:var(--text-xs);
  letter-spacing:var(--tracking-label);
  text-transform:uppercase;
  color:var(--text-faint);
  margin-bottom:var(--sp-1);
}

/* ---- composer ---- */
.composer{
  border-top:var(--border-w) solid var(--border);
  background:var(--surface);
  padding:var(--sp-4) var(--sp-5);
  display:grid;
  gap:var(--sp-3);
}
#composer-input{
  width:100%;
  min-height:calc(var(--control-h-lg) * 2);
  resize:vertical;
  padding:var(--sp-3);
  background:var(--surface-inset);
  color:var(--text);
  border:var(--border-w) solid var(--border-strong);
  border-radius:var(--radius-md);
  font-family:var(--font-prose);
  font-size:var(--text-md);
  line-height:var(--leading-normal);
}
.composer-actions{display:flex;align-items:center;justify-content:flex-end;gap:var(--sp-2)}

.btn{
  height:var(--control-h-md);
  padding:0 var(--sp-4);
  border-radius:var(--radius-sm);
  border:var(--border-w) solid var(--border-strong);
  background:var(--surface-raised);
  color:var(--text);
  font-family:var(--font-prose);
  font-size:var(--text-sm);
  font-weight:var(--weight-medium);
  cursor:pointer;
  transition:background var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out);
}
.btn:hover{border-color:var(--accent-border);background:var(--accent-surface)}
.btn-primary{
  border-color:var(--accent-border);
  background:var(--accent-surface);
  color:var(--accent-strong);
  font-weight:var(--weight-semibold);
}
.btn-quiet{
  height:var(--control-h-sm);
  padding:0 var(--sp-3);
  background:var(--surface);
  color:var(--text-muted);
  font-family:var(--font-system);
  font-size:var(--text-xs);
  letter-spacing:var(--tracking-label);
  text-transform:uppercase;
}

/* ---- rail: gate + safety ---- */
.rail{
  border-left:var(--border-w) solid var(--border);
  background:var(--surface);
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  min-height:0;
  min-width:0;
}
.rail-head{
  padding:var(--sp-3) var(--sp-5);
  border-bottom:var(--border-w) solid var(--border-subtle);
  font-family:var(--font-system);
  font-size:var(--text-xs);
  letter-spacing:var(--tracking-label);
  text-transform:uppercase;
  color:var(--text-faint);
}
#approval{
  overflow-y:auto;
  min-height:0;
  padding:var(--sp-4) var(--sp-5);
  display:flex;
  flex-direction:column;
  gap:var(--sp-3);
}
/* gates read calm: no alarm surfaces, no motion */
.gate{
  border:var(--border-w) solid var(--border);
  border-left:var(--sp-1) solid var(--prov-proposed);
  border-radius:var(--radius-md);
  background:var(--surface-raised);
  padding:var(--sp-4);
}

.safety{
  border-top:var(--border-w) solid var(--border-subtle);
  background:var(--surface-inset);
  padding:var(--sp-3) var(--sp-5);
  display:grid;
  gap:var(--sp-2);
}
.safety-row{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3)}
.safety-key{
  font-family:var(--font-system);
  font-size:var(--text-xs);
  letter-spacing:var(--tracking-label);
  text-transform:uppercase;
  color:var(--text-faint);
}
#safety-approval-mode,#safety-sandbox{
  font-family:var(--font-system);
  font-size:var(--text-sm);
  color:var(--text-muted);
  min-width:10ch;
  min-height:1.4em;
  text-align:right;
}
</style>
</head>
<body>
<div class="shell">

  <header class="bar">
    <span class="mark"><em>›</em> neo-agent_</span>
    <div class="bar-right">
      <span class="bar-label" id="connection-status-label">Link</span>
      <span id="connection-status" role="status" aria-live="polite" aria-labelledby="connection-status-label"></span>
    </div>
  </header>

  <div class="body">

    <main class="stream" aria-label="Session">
      <div class="strip">
        <span id="transcript-truncation" aria-live="polite"></span>
        <button type="button" id="transcript-load-more" class="btn btn-quiet">Load earlier</button>
      </div>

      <section id="transcript" aria-label="Transcript" tabindex="0"></section>

      <div class="composer">
        <label class="sr-only" for="composer-input">Message to the agent</label>
        <textarea id="composer-input" rows="3" spellcheck="false"></textarea>
        <div class="composer-actions">
          <button type="button" id="run-abort" class="btn">Stop run</button>
          <button type="button" id="composer-submit" class="btn btn-primary">Send</button>
        </div>
      </div>
    </main>

    <aside class="rail" aria-label="Approvals and safety">
      <div class="rail-head">Approval gate</div>
      <section id="approval" aria-label="Pending approvals"></section>
      <div class="safety">
        <div class="safety-row">
          <span class="safety-key" id="safety-approval-mode-label">Approval mode</span>
          <span id="safety-approval-mode" aria-labelledby="safety-approval-mode-label"></span>
        </div>
        <div class="safety-row">
          <span class="safety-key" id="safety-sandbox-label">Sandbox</span>
          <span id="safety-sandbox" aria-labelledby="safety-sandbox-label"></span>
        </div>
      </div>
    </aside>

  </div>
</div>
<script type="module" src="/client/main.js"></script>
</body>
</html>
